server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: study-companion-backend

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/study_companion}
    username: ${SPRING_DATASOURCE_USERNAME:asc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    max-sources: ${AI_MAX_SOURCES:3}
    max-context-tokens: ${AI_MAX_CONTEXT_TOKENS:2048}
    ckey:
      base-url: ${CKEY_API_BASE_URL:}
      api-key: ${CKEY_API_KEY:}
      model: ${MIMO_MODEL_ID:mimo-v2-flash}
    brave:
      api-key: ${BRAVE_API_KEY:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:15}
    submit-per-minute: ${RATE_LIMIT_SUBMIT_PER_MINUTE:20}
  ops:
    admin-secret: ${OPS_ADMIN_SECRET:}
