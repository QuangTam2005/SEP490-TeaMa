services:
  postgres:
    image: postgres:16-alpine
    container_name: asc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-study_companion}
      POSTGRES_USER: ${POSTGRES_USER:-asc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asc_user} -d ${POSTGRES_DB:-study_companion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-study_companion}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-asc_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      CKEY_API_BASE_URL: ${CKEY_API_BASE_URL:-}
      CKEY_API_KEY: ${CKEY_API_KEY:-}
      MIMO_MODEL_ID: ${MIMO_MODEL_ID:-mimo-v2-flash}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      AI_MAX_SOURCES: ${AI_MAX_SOURCES:-3}
      AI_MAX_CONTEXT_TOKENS: ${AI_MAX_CONTEXT_TOKENS:-2048}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - asc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
      NEXT_PUBLIC_DATA_MODE: ${NEXT_PUBLIC_DATA_MODE:-api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - asc_network

volumes:
  postgres_data:
    name: asc_postgres_data

networks:
  asc_network:
    name: asc_network
    driver: bridge
